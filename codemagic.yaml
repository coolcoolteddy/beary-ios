# Codemagic 对等配置：对标 .github/workflows/ios.yml 里的 sideload job
# 无签名 device Release 包 + 打 beary.ipa（侧载包，不走商店签名）
workflows:
  ios-sideload:
    name: iOS sideload
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build for device (unsigned)
        script: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package .ipa
        script: |
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -r beary.ipa Payload
    artifacts:
      - beary.ipa
