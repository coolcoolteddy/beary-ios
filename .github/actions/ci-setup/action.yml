name: CI setup
description: >-
  Shared setup steps for the iOS CI jobs (simulator / sideload / test).
  The caller checks out the repo first; this covers the SwiftPM cache,
  the optional DerivedData cache, the official beary-ui asset check,
  Node 22 setup and `npm ci`.

inputs:
  cache-deriveddata:
    description: Whether to cache DerivedData (the `build` path) for this job.
    required: false
    default: 'false'
  deriveddata-key-prefix:
    description: Prefix for the DerivedData cache key (e.g. deriveddata-simulator-).
    required: false
    default: 'deriveddata-'

runs:
  using: composite
  steps:
    # CI 提速：SPM 包源缓存（lottie-ios、capacitor-swift-pm 等远程包的下载产物，
    # 只含包源、不含编译产物；仓库未提交 Package.resolved，key 按 pin 住 SPM
    # 版本的文件哈希，版本变了即失效）。
    - name: Cache SwiftPM packages
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: spm-${{ runner.os }}-${{ hashFiles('ios/App/App.xcodeproj/project.pbxproj', 'ios/App/CapApp-SPM/Package.swift') }}
        restore-keys: |
          spm-${{ runner.os }}-

    # CI 提速：DerivedData 增量缓存（只含中间编译产物；xcodebuild 仍对每个源文件
    # 做增量校验，编不过的源码照样失败，缓存盖不住编译错误；key 按工程与 workflow
    # 文件哈希，结构变了即失效，命中失败时 restore-key 回落到最近一份）。
    # test job 不走 -derivedDataPath，不缓存 DerivedData。
    - name: Cache DerivedData
      if: inputs.cache-deriveddata == 'true'
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ inputs.deriveddata-key-prefix }}${{ runner.os }}-${{ hashFiles('ios/App/App.xcodeproj/project.pbxproj', 'ios/App/CapApp-SPM/Package.swift', '.github/workflows/ios.yml') }}
        restore-keys: |
          ${{ inputs.deriveddata-key-prefix }}${{ runner.os }}-

    # 审计三轮第 27 项：官方 beary-ui 资产完整性校验（只读，不改 App 行为）。
    # 代码引用的官方资产缺失时在此失败并报清缺失项，不靠运行时 SF 回退蒙混。
    - name: Check official beary-ui assets are complete
      run: python3 scripts/check-beary-assets.py
      shell: bash

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci
      shell: bash
