name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx cap sync ios

      - name: Build for simulator (unsigned)
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - uses: actions/upload-artifact@v4
        with:
          name: beary-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/App.app

  sideload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx cap sync ios

      - name: Build for device (unsigned)
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -r beary.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: beary-ipa
          path: beary.ipa
